<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08261f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Shopping List">
  <title>Shopping List</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">NAS shopping reminder</p>
      <h1>What do we need?</h1>
      <p class="subtitle">Add it here. It will be waiting on Tesco.</p>
    </header>

    <form id="add-form" class="add-card" autocomplete="off">
      <label for="item-name">Item</label>
      <div class="add-row">
        <input id="item-name" name="name" type="text" maxlength="120"
               enterkeyhint="done" autocapitalize="sentences" required>
        <div class="quantity-wrap">
          <label class="sr-only" for="item-quantity">Quantity</label>
          <input id="item-quantity" name="quantity" type="number" min="1" max="999" value="1" inputmode="numeric">
        </div>
        <button class="add-button" type="submit">Add</button>
      </div>
      <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
    </form>

    <section class="list-section" aria-labelledby="active-heading">
      <div class="section-heading">
        <h2 id="active-heading">Still needed</h2>
        <span id="active-count" class="count-badge">0</span>
      </div>
      <div id="active-list" class="item-list" aria-live="polite"></div>
    </section>

    <details id="completed-section" class="completed-section">
      <summary>
        <span>Picked up</span>
        <span id="completed-count" class="count-badge muted">0</span>
      </summary>
      <div id="completed-list" class="item-list completed-list"></div>
    </details>
  </main>

  <template id="item-template">
    <article class="item-card">
      <button class="check-button" type="button" aria-label="Mark item complete"></button>
      <div class="item-main">
        <span class="item-name"></span>
        <label class="quantity-edit">
          <span>Qty</span>
          <input type="number" min="1" max="999" inputmode="numeric">
        </label>
      </div>
      <button class="delete-button" type="button" aria-label="Delete item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 2h4v2H4V5h4l1-2Zm-2 6h10l-1 11H8L7 9Zm3 2v7h2v-7h-2Zm4 0v7h2v-7h-2Z"/></svg>
      </button>
    </article>
  </template>

  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
